[project]
name = "lexa-backend"
version = "0.1.0"
description = "LEXA — Personal AI Operating System backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.16",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32",
  "psycopg[binary,pool]>=3.3",
  "alembic>=1.20",
  "pgvector>=0.5",
  "redis>=8.1",
  "anthropic>=2.8,<3",
  "openai>=3.50,<4",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.2,<3.3",
  "argon2-cffi>=25.1",
  "pyjwt>=2.15",
  "cryptography>=50",
  "httpx>=0.28",
  "croniter>=7.0",
  "sse-starlette>=3.7",
  "python-multipart>=0.0.20",
  "pypdf>=6.0",
  "beautifulsoup4>=4.13",
]

[project.optional-dependencies]
browser = ["playwright>=1.65"]
dev = ["pytest>=8.4", "pytest-asyncio>=1.5", "ruff>=0.17", "mypy>=2.4", "pip-audit>=2.9"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["database/migrations/versions", "trading/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["trading/vendor/"]
