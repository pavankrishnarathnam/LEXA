name: Deploy

# Production deployments run only for published releases whose tag points at a commit on main,
# after the full CI suite passes, and require approval through the "production" environment.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)deploy, e.g. v1.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  guard:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ env.TAG }}" }
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tag must be on main and not a pre-release from an untrusted fork
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then echo "::error::pre-releases are not deployed"; exit 1; fi

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  images:
    name: Build & publish versioned images
    needs: [guard, ci]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - id: ns
        run: echo "registry=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ env.TAG }}
          tags: ${{ steps.ns.outputs.registry }}/lexa-backend:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ needs.guard.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.ns.outputs.registry }}/lexa-frontend:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ needs.guard.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [guard, images]
    runs-on: ubuntu-latest
    environment:
      name: production   # configure required reviewers in Settings → Environments
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Pull release and deploy (health checks + automatic rollback)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s -- "$TAG" "$SHA" "$DEPLOY_PATH" "$GHCR_USER" <<'REMOTE'
          set -euo pipefail
          TAG="$1"; SHA="$2"; DEPLOY_PATH="$3"; GHCR_USER="$4"
          cd "$DEPLOY_PATH"
          git fetch --tags --force origin
          git checkout --force "$TAG"
          test "$(git rev-parse HEAD)" = "$SHA"
          REGISTRY="ghcr.io/$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')"
          sed -i "s|^LEXA_REGISTRY=.*|LEXA_REGISTRY=$REGISTRY|" .env
          GIT_SHA="$SHA" infrastructure/scripts/deploy.sh "$TAG"
          REMOTE
        # GHCR_TOKEN (read:packages) is only needed for private images; log in on the VPS once with
        # `echo <token> | docker login ghcr.io -u <user> --password-stdin`, or add it here if you prefer.
      - name: Post-deploy HTTPS check
        env: { DOMAIN: "${{ vars.LEXA_DOMAIN }}" }
        if: ${{ vars.LEXA_DOMAIN != '' }}
        run: curl -fsS "https://$DOMAIN/api/health/ready"
