name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.lock --strict --desc
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high

  sast:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy:
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  bandit:
    name: Python security lint (ruff S rules / bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install ruff==0.17.5
      - working-directory: backend
        run: ruff check --select S --output-format=github .

  images:
    name: Container image scanning (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix: { image: [backend, frontend] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: "${{ matrix.image }}", load: true, tags: "lexa-${{ matrix.image }}:scan", cache-from: type=gha }
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lexa-${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
