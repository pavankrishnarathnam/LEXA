name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: lexa, POSTGRES_PASSWORD: lexa, POSTGRES_DB: lexa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lexa" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - run: pip install -r requirements-dev.lock
      - name: Ruff (lint + security rules)
        run: ruff check .
      - name: Mypy
        run: mypy api core agents orchestration memory integrations database workers trading main.py
      - name: Migrations apply and roll back cleanly
        env: { DATABASE_URL: "postgresql+asyncpg://lexa:lexa@localhost:5432/lexa" }
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Pytest (real Postgres + Redis)
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://lexa:lexa@localhost:5432/lexa_test"
          TEST_REDIS_URL: "redis://localhost:6379/15"
        run: pytest -q

  frontend:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    name: End-to-end (browser → Next.js → API → worker → Postgres/Redis)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: lexa, POSTGRES_PASSWORD: lexa, POSTGRES_DB: lexa }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lexa" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: "postgresql+asyncpg://lexa:lexa@localhost:5432/lexa"
      REDIS_URL: "redis://localhost:6379/2"
      UPLOAD_DIR: "/tmp/lexa-e2e-uploads"
      TRADER_DATA_DIR: "/tmp/lexa-e2e-trader"
      BACKEND_URL: "http://127.0.0.1:8000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start backend test harness (API + worker, scripted LLM)
        working-directory: backend
        run: |
          pip install -r requirements-dev.lock
          python -m alembic upgrade head
          nohup python -m tests.e2e_server > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund && npm run build
          nohup npm start > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login >/dev/null && curl -fsS http://localhost:3000/api/health && break; sleep 2; done
      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --trace off
      - if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/next.log"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, tags: "lexa-backend:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: false, tags: "lexa-frontend:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci/' .env
          docker compose config --quiet

  config:
    name: Environment configuration & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - run: pip install -r backend/requirements-dev.lock
      - name: .env.example covers every setting; no secrets in examples
        run: python infrastructure/scripts/check_env.py
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.lock --strict
      - name: npm audit (production deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Shell scripts lint
        run: shellcheck infrastructure/scripts/*.sh
