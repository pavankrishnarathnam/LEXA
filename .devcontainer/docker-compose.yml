# GitHub Codespaces stack: the app container runs API + worker + frontend; Postgres and Redis run beside it.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgresql+asyncpg://lexa:lexa@db:5432/lexa
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /home/vscode/lexa-data/uploads
      TRADER_DATA_DIR: /home/vscode/lexa-data/trader
      BACKUP_STATUS_FILE: /home/vscode/lexa-data/last_backup.json
    depends_on: [db, redis]

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment: { POSTGRES_USER: lexa, POSTGRES_PASSWORD: lexa, POSTGRES_DB: lexa }
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

volumes:
  pgdata: {}
  redisdata: {}
